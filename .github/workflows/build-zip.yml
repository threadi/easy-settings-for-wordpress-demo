name: Build release zip

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build
        run: |
          composer install
          rm dev-composer.sh
          rm dev-composer.json
          rm readme.md
          rm .gitignore
          rm -fr .github
          rm -fr releases
          rm -fr build

      - name: Generate autoloader
        run: composer dump-autoload -oa --no-dev

      - name: Run PHPStan analyse
        run: vendor/bin/phpstan analyse

      - name: Run WordPress Coding Standard fixes
        run: vendor/bin/phpcbf .

      - uses: anchore/sbom-action@v0

      - name: Set version number 1
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'easy-settings-for-wordpress-demo.php'
          search-text: '@@VersionNumber@@'
          replacement-text: ${{ github.ref_name }}

      - name: Set version number 2
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'readme.txt'
          search-text: '@@VersionNumber@@'
          replacement-text: ${{ github.ref_name }}

      - name: Run PCP check
        uses: wordpress/plugin-check-action@v1
        with:
          ignore-codes:
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound
          include-experimental: false
          error-severity: 7
          warning-severity: 6
          include-low-severity-errors: true
        continue-on-error: true

      - name: ZIP plugin
        run: |
          cd ..
          zip -r -q ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}/* -x "*/.git/*" "*/.github/*" "*/changelog.md" "*/phpstan.neon" "*/phpcs.xml.dist" "*/composer.lock" "*/.gitignore" "*/vendor/*" "*/dev-composer.json"
          zip -ur ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}/vendor/autoload.php
          zip -ur ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}/vendor/composer/*
          zip -ur ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}/vendor/threadi/easy-settings-for-wordpress/*
          zip -ur ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}/vendor/threadi/easy-dialog-for-wordpress/build/*
          cp ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ github.event.repository.name }}.zip